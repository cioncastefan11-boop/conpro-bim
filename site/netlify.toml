# Site-ul de prezentare (bim.conpro.ro): al doilea site Netlify din același depozit,
# cu „Base directory” = site. Paginile sunt deja generate în public/ (node site/src/genereaza.mjs).
[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/app/*"
  to = "https://app.conpro.ro/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://snap.licdn.com; img-src 'self' data: https://www.google-analytics.com https://*.google.com https://*.google.ro https://www.googletagmanager.com https://*.doubleclick.net https://www.facebook.com https://px.ads.linkedin.com https://*.linkedin.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.doubleclick.net https://www.facebook.com https://connect.facebook.net https://px.ads.linkedin.com https://*.linkedin.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
